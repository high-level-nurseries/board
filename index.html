<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة مجلس الإدارة</title>
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--ink:#1f1f1d;--muted:#6b6a64;--line:#e6e4dc;
  --fin:#0f6e56;--fin-bg:#e1f5ee;--fin-ring:#1d9e75;
  --tea:#3c3489;--tea-bg:#eeedfe;--tea-ring:#7f77dd;
  --stu:#712b13;--stu-bg:#faece7;--stu-ring:#d85a30;
  --neg:#a32d2d;--pos:#0f6e56;--warn-bg:#faeeda;--warn:#854f0b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161614;--card:#21211f;--ink:#f1efe8;--muted:#a8a69e;--line:#34332f;
  --fin:#e1f5ee;--fin-bg:#085041;--fin-ring:#5dcaa5;
  --tea:#eeedfe;--tea-bg:#3c3489;--tea-ring:#afa9ec;
  --stu:#faece7;--stu-bg:#712b13;--stu-ring:#f0997b;
  --neg:#f09595;--pos:#9fe1cb;--warn-bg:#633806;--warn:#fac775;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:8px 0 16px}
header img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#fff}
header h1{font-size:20px;margin:0;font-weight:700}
header .sub{font-size:13px;color:var(--muted)}
header .sp{flex:1}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h2{font-size:16px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.c{background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;color:inherit}
.circ{width:min(132px,27vw);aspect-ratio:1;border-radius:50%;border:4px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .15s;padding:6px}
.c:hover .circ,.c:focus-visible .circ{transform:scale(1.05)}
.c.on .circ{outline:3px solid var(--ink);outline-offset:3px}
.big{font-size:clamp(18px,4.6vw,26px);font-weight:700;line-height:1.1;direction:ltr}
.small{font-size:clamp(10px,2.6vw,12px)}
.mini{font-size:clamp(10px,2.6vw,12px);margin-top:4px;direction:ltr}
.lbl{font-size:14px;font-weight:500}
.fin .circ{background:var(--fin-bg);border-color:var(--fin-ring);color:var(--fin)}
.tea .circ{background:var(--tea-bg);border-color:var(--tea-ring);color:var(--tea)}
.stu .circ{background:var(--stu-bg);border-color:var(--stu-ring);color:var(--stu)}
.det{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:none}
.det.show{display:block}
.det h3{font-size:15px;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:18px;font-weight:700;direction:ltr;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n{direction:ltr;text-align:left;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.center img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#fff}
.err{color:var(--neg);font-size:14px;max-width:340px}
.muted{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--fin-ring)}
.bar.e{background:var(--stu-ring)}
@media (max-width:420px){.wrap{padding:12px}.sec{padding:12px}}
</style>
</head>
<body>
<div class="wrap">

<div id="login" class="center">
  <img class="logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="شعار حضانات هاي ليفيل">
  <div><div style="font-size:20px;font-weight:700">لوحة مجلس الإدارة</div><div class="muted">حضانات هاي ليفيل — لأعضاء المجلس فقط</div></div>
  <div id="gbtn"></div>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" style="display:none">
  <header>
    <img class="logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="شعار حضانات هاي ليفيل">
    <div><h1>لوحة مجلس الإدارة</h1><div class="sub" id="meta"></div></div>
    <div class="sp"></div>
    <button class="btn" id="refresh">تحديث</button>
    <button class="btn" id="logout" title="خروج من هذا الجهاز">خروج</button>
  </header>

  <section class="sec fin">
    <h2><span class="dot" style="background:var(--fin-ring)"></span>الوضع المالي <span class="muted" id="fyLbl"></span></h2>
    <div class="row" id="finRow"></div>
    <div class="det" id="finDet"></div>
  </section>

  <section class="sec tea">
    <h2><span class="dot" style="background:var(--tea-ring)"></span>المعلمات الفعّالات</h2>
    <div class="row" id="teaRow"></div>
    <div class="det" id="teaDet"></div>
  </section>

  <section class="sec stu">
    <h2><span class="dot" style="background:var(--stu-ring)"></span>الطلاب المسجلون</h2>
    <div class="row" id="stuRow"></div>
    <div class="det" id="stuDet"></div>
  </section>

  <p class="muted" style="text-align:center">الأرقام تُحسب تلقائيًا من جداول الحضانة. للعرض فقط.</p>
</div>

</div>

var API_URL = 'https://script.google.com/macros/s/AKfycbwOHZH-hlziKZeVTzM2lnJEecWNnldS91ngW_Zbc7XOzuw_JoMi1Vl_J6qqVCcI1eiG/exec';
var CLIENT_ID = '1032562749843-fgn2v6chd6funotieibckn6jtv57hc0t.apps.googleusercontent.com';

var DATA = null, busy = false;
var BR = {N7:'فرع N7', N8:'فرع N8', ALL:'الإجمالي'};
var K_SES='hlBoardSession', K_DATA='hlBoardData';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

function $(id){return document.getElementById(id)}
function fmt(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})}
function fmt3(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})}
function sign(n){return (n>0?'+':'')+fmt(n)}
function cls(n){return n<0?'neg':'pos'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function mName(m){var p=m.split('-');return MONTHS[+p[1]-1]+' '+p[0]}

/* الفتح: إذا الجهاز معروف تظهر آخر أرقام فورًا ثم تتحدث بالخلفية — بدون أي خطوة دخول */
(function start(){
  $('refresh').onclick=function(){fetchData({refresh:true})};
  $('logout').onclick=logout;
  var ses=lsGet(K_SES);
  if(ses){
    var cached=lsGet(K_DATA);
    if(cached){try{DATA=JSON.parse(cached);render(true)}catch(e){}}
    fetchData({});
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&DATA)fetchData({})});
  } else {
    showLogin('');
  }
})();

/* زر Google يُحمَّل فقط عند الحاجة (أول مرة من الجهاز) */
var gisLoaded=false;
function loadGoogle(){
  if(gisLoaded)return;gisLoaded=true;
  var sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
  sc.onload=function(){
    google.accounts.id.initialize({client_id:CLIENT_ID,callback:function(r){fetchData({idToken:r.credential})},auto_select:true,ux_mode:'popup'});
    google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',text:'signin_with',shape:'pill',locale:'ar'});
    google.accounts.id.prompt();
  };
  sc.onerror=function(){$('loginErr').textContent='تعذّر تحميل تسجيل الدخول. تأكد من الاتصال.'};
  document.head.appendChild(sc);
}

function fetchData(opt){
  if(busy)return;busy=true;
  var body={refresh:!!opt.refresh};
  if(opt.idToken)body.idToken=opt.idToken;else body.session=lsGet(K_SES);
  if($('app').style.display!=='none')$('meta').textContent=metaText()+' — جارٍ التحديث…';
  else $('loginErr').innerHTML='<span class="muted">جارٍ تحميل البيانات…</span>';
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
  .then(function(r){return r.json()})
  .then(function(res){
    busy=false;
    if(!res.ok){
      if(res.sessionInvalid){lsDel(K_SES);lsDel(K_DATA);DATA=null}
      if(DATA&&!res.sessionInvalid){$('meta').textContent=metaText()+' — تعذّر التحديث';return}
      showLogin(res.error);return;
    }
    if(res.session)lsSet(K_SES,res.session);
    DATA=res.data;lsSet(K_DATA,JSON.stringify(DATA));render(false);
  })
  .catch(function(){
    busy=false;
    if(DATA){$('meta').textContent=metaText()+' — لا يوجد اتصال، تُعرض آخر أرقام';return}
    showLogin('تعذّر الاتصال بالنظام. حاول مرة أخرى.');
  });
}

function logout(){
  var ses=lsGet(K_SES);
  if(ses)fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({logout:true,session:ses})}).catch(function(){});
  lsDel(K_SES);lsDel(K_DATA);DATA=null;
  try{google.accounts.id.disableAutoSelect()}catch(e){}
  showLogin('تم الخروج من هذا الجهاز.');
}

function metaText(){return 'أهلًا '+(DATA.viewer.name||'')+' — آخر تحديث '+DATA.generatedAt}

function showLogin(msg){$('app').style.display='none';$('login').style.display='flex';$('loginErr').textContent=msg||'';loadGoogle()}

function circle(group,key,big,unit,mini,label){
  return '<button class="c" data-g="'+group+'" data-k="'+key+'"><div class="circ"><span class="big">'+big+'</span><span class="small">'+unit+'</span>'+(mini?'<span class="mini">'+mini+'</span>':'')+'</div><span class="lbl">'+label+'</span></button>';
}

function render(fromCache){
  var open=document.querySelector('.c.on');var og=open&&open.dataset.g,ok=open&&open.dataset.k;
  $('login').style.display='none';$('app').style.display='block';
  $('meta').textContent=metaText()+(fromCache?' — جارٍ التحديث…':'');
  $('fyLbl').textContent='('+DATA.fyLabel+')';
  var keys=['N7','N8','ALL'];
  $('finRow').innerHTML=keys.map(function(k){var f=DATA.finance[k];
    return circle('fin',k,sign(f.year.net),'د.ك صافي السنة','الشهر: '+sign(f.month.net),BR[k])}).join('');
  $('teaRow').innerHTML=keys.map(function(k){return circle('tea',k,DATA.teachers[k].count,'معلمة',null,BR[k])}).join('');
  $('stuRow').innerHTML=keys.map(function(k){return circle('stu',k,DATA.students[k].count,'طالبًا',null,BR[k])}).join('');
  document.querySelectorAll('.c').forEach(function(b){b.onclick=function(){toggle(b)}});
  ['finDet','teaDet','stuDet'].forEach(function(id){$(id).classList.remove('show')});
  if(og){var b=document.querySelector('.c[data-g="'+og+'"][data-k="'+ok+'"]');if(b)toggle(b)}
}

function toggle(b){
  var g=b.dataset.g,k=b.dataset.k,det=$(g+'Det');
  var was=b.classList.contains('on');
  document.querySelectorAll('.c[data-g="'+g+'"]').forEach(function(x){x.classList.remove('on')});
  if(was){det.classList.remove('show');return}
  b.classList.add('on');
  det.innerHTML=(g==='fin'?finDetail(k):g==='tea'?teaDetail(k):stuDetail(k));
  det.classList.add('show');
}

function kpi(k,v,c){return '<div class="kpi"><div class="k">'+k+'</div><div class="v '+(c||'')+'">'+v+'</div></div>'}

function finDetail(k){
  var f=DATA.finance[k];
  var h='<h3>الوضع المالي — '+BR[k]+'</h3>';
  h+='<div class="muted" style="margin-bottom:6px">السنة المالية (منذ '+DATA.fyStart+')</div><div class="grid2">'+
    kpi('الإيرادات',fmt3(f.year.revenue))+kpi('المصروفات',fmt3(f.year.expenses))+kpi('الصافي',sign(f.year.net),cls(f.year.net))+'</div>';
  var c=f.carried;
  if(c&&(c.balancesIn||c.balancesOut||c.transfers)){
    h+='<div class="muted" style="margin:-4px 0 12px">'+
      (c.balancesIn?'الإيرادات تشمل الموازنة المنقولة من الموقع القديم '+fmt3(c.balancesIn)+' د.ك':'')+
      (c.balancesOut?' — المصروفات تشمل تسوية موازنة '+fmt3(c.balancesOut)+' د.ك':'')+
      (c.transfers?' — تحويل العهدة للمشرفات ('+fmt3(c.transfers)+' د.ك) يظهر منفصلًا ولا يُحسب مصروفًا':'')+'</div>';
  }
  h+='<div class="muted" style="margin-bottom:6px">الشهر الحالي ('+mName(DATA.month)+')</div><div class="grid2">'+
    kpi('الإيرادات',fmt3(f.month.revenue))+kpi('المصروفات',fmt3(f.month.expenses))+kpi('الصافي',sign(f.month.net),cls(f.month.net))+'</div>';
  if(f.monthly.length){
    var max=Math.max.apply(null,f.monthly.map(function(m){return Math.max(m.rev,m.exp)}))||1;
    h+='<h3>الحركة الشهرية</h3><table><tr><th>الشهر</th><th>الإيرادات</th><th>المصروفات</th><th>الصافي</th></tr>'+
      f.monthly.map(function(m){return '<tr><td>'+mName(m.month)+'<div class="bar" style="width:'+Math.round(m.rev/max*100)+'%"></div><div class="bar e" style="width:'+Math.round(m.exp/max*100)+'%;margin-top:2px"></div></td><td class="n">'+fmt(m.rev)+'</td><td class="n">'+fmt(m.exp)+'</td><td class="n '+cls(m.net)+'">'+sign(m.net)+'</td></tr>'}).join('')+'</table>';
  }
  h+='<h3>الإيرادات حسب البند (السنة)</h3><table>'+f.revenueByItem.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="n">'+fmt3(x.value)+'</td></tr>'}).join('')+'</table>';
  if(f.expensesByItem.length) h+='<h3>المصروفات حسب البند (السنة)</h3><table>'+f.expensesByItem.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="n">'+fmt3(x.value)+'</td></tr>'}).join('')+'</table>';
  if(f.lastExpenses.length) h+='<h3>آخر المصروفات</h3><table><tr><th>التاريخ</th>'+(k==='ALL'?'<th>الفرع</th>':'')+'<th>البند</th><th>المستفيد</th><th>المبلغ</th></tr>'+
    f.lastExpenses.map(function(x){return '<tr><td class="n">'+x.date+'</td>'+(k==='ALL'?'<td>'+x.branch+'</td>':'')+'<td>'+esc(x.item)+'</td><td>'+esc(x.beneficiary)+'</td><td class="n">'+fmt3(x.amount)+'</td></tr>'}).join('')+'</table>';
  return h;
}

function teaDetail(k){
  var t=DATA.teachers[k];
  var h='<h3>المعلمات على رأس العمل — '+BR[k]+'</h3><div class="grid2">'+kpi('العدد',t.count)+kpi('إجمالي الرواتب الشهرية',fmt3(t.payroll))+kpi('غادرن',t.left)+'</div>';
  h+='<table><tr><th>المعلمة</th>'+(k==='ALL'?'<th>الفرع</th>':'')+'<th>الحصص</th><th>الراتب</th><th>ملاحظات</th></tr>'+
    t.list.map(function(x){return '<tr><td>'+esc(x.name)+'</td>'+(k==='ALL'?'<td>'+x.branch+'</td>':'')+'<td class="n">'+x.lessons+'</td><td class="n">'+fmt3(x.salary)+'</td><td class="muted">'+esc(x.notes)+'</td></tr>'}).join('')+'</table>';
  return h;
}

function stuDetail(k){
  var s=DATA.students[k];
  var h='<h3>الطلاب — '+BR[k]+'</h3><div class="grid2">'+kpi('العدد',s.count)+kpi('لم يسددوا بعد',s.overdueStudents,s.overdueStudents?'neg':'')+kpi('المبلغ غير المسدد',fmt3(s.overdueAmount),s.overdueAmount?'neg':'')+'</div>'+
    '<div class="muted" style="margin:-4px 0 12px">يشمل قسط الشهر الحالي ('+mName(DATA.month)+') حتى لو لم يتأخر بعد. الحساب يبدأ من أقساط '+mName(DATA.dueFrom)+' (ما بعد 3 أكتوبر)، لأن دفعات ما قبلها مسجلة في الموقع القديم.</div>';
  h+='<h3>حسب الفصل</h3><table>'+s.byClass.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="n">'+x.value+'</td></tr>'}).join('')+'</table>';
  h+='<h3>قائمة الطلاب</h3><table><tr><th>الطالب</th>'+(k==='ALL'?'<th>الفرع</th>':'')+'<th>الفصل</th><th>القسط</th></tr>'+
    s.list.map(function(x){return '<tr><td>'+esc(x.name)+'</td>'+(k==='ALL'?'<td>'+x.branch+'</td>':'')+'<td>'+esc(x.cls)+'</td><td>'+(x.dueCount?'<span class="tag">غير مسدد '+fmt3(x.dueAmount)+'</span>':'<span class="pos">مسدد</span>')+'</td></tr>'}).join('')+'</table>';
  return h;
}
</script>
</body>
</html>
